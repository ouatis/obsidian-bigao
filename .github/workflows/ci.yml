name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      # One step on purpose: `npm run verify` already orders build before
      # test:source-bundle / test:parity, which both read dist/main.js.
      - run: npm run verify
