  <text x="672" y="374" class="mono muted">DRAFT A</text>
  <text x="1100" y="374" text-anchor="end" class="mono muted">DRAFT B</text>
  <text x="40" y="453" class="mono muted">COLLATE · SIDE-BY-SIDE DIFF</text>
